<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recharger</title>
<style>
  :root{
    --bg-deep:#0a1f44;
    --bg-mid:#123a7a;
    --bg-light:#1e5fb8;
    --accent:#5ec8ff;
    --accent2:#ffd166;
    --panel:#0f2a5c;
    --panel-light:#16407e;
    --text:#eaf4ff;
    --text-dim:#9fc1ea;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Segoe UI',system-ui,sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(94,200,255,0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,209,102,0.08), transparent 40%),
      linear-gradient(160deg, var(--bg-deep), var(--bg-mid) 55%, var(--bg-light));
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
  }
  header{
    text-align:center;
    padding:48px 16px 24px;
  }
  header h1{
    font-size:clamp(2.5rem,6vw,4.5rem);
    margin:0;
    letter-spacing:2px;
    background:linear-gradient(90deg,var(--accent),#ffffff 60%,var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(94,200,255,0.35);
  }
  header p{
    color:var(--text-dim);
    margin-top:8px;
    font-size:1.05rem;
  }

  .dock{
    display:flex;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
    padding:20px;
  }

  .dock-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    background:var(--panel);
    border:1px solid rgba(94,200,255,0.25);
    border-radius:20px;
    padding:22px 30px;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    color:var(--text);
    width:160px;
  }
  .dock-btn:hover{
    transform:translateY(-6px);
    box-shadow:0 12px 30px rgba(0,0,0,0.35), 0 0 0 1px rgba(94,200,255,0.4);
    background:var(--panel-light);
  }
  .dock-btn .icon{
    font-size:2.6rem;
    filter:drop-shadow(0 0 10px rgba(94,200,255,0.5));
  }
  .dock-btn span.label{
    font-weight:600;
    letter-spacing:0.5px;
  }

  /* ---------- Overlay / Modal ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(5,12,30,0.72);
    backdrop-filter:blur(6px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    animation:fadeIn .18s ease;
  }
  .overlay.active{display:flex;}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .modal{
    background:var(--panel);
    border:1px solid rgba(94,200,255,0.3);
    border-radius:22px;
    padding:22px;
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    max-width:92vw;
    animation:pop .22s cubic-bezier(.2,1.4,.4,1);
    position:relative;
  }
  @keyframes pop{
    from{transform:scale(.85);opacity:0}
    to{transform:scale(1);opacity:1}
  }
  .modal .close-btn{
    position:absolute;
    top:10px;right:14px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:1.4rem;
    cursor:pointer;
  }
  .modal .close-btn:hover{color:var(--accent2);}
  .modal h2{
    margin:0 0 14px;
    text-align:center;
    color:var(--accent);
    letter-spacing:1px;
  }

  /* ---------- Calculator ---------- */
  #calcModal .modal{width:300px;}
  #calcDisplay{
    background:#081733;
    border-radius:10px;
    padding:16px;
    text-align:right;
    font-size:2rem;
    color:var(--text);
    margin-bottom:12px;
    min-height:1.4em;
    overflow-x:auto;
    word-wrap:break-word;
  }
  .calc-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .calc-grid button{
    padding:16px 0;
    border:none;
    border-radius:10px;
    background:var(--panel-light);
    color:var(--text);
    font-size:1.1rem;
    cursor:pointer;
    transition:background .12s ease, transform .08s ease;
  }
  .calc-grid button:hover{background:#1c4f9c;}
  .calc-grid button:active{transform:scale(.94);}
  .calc-grid button.op{background:#2a6bd6;}
  .calc-grid button.eq{background:var(--accent2);color:#20260a;font-weight:700;}
  .calc-grid button.eq:hover{background:#ffdd8c;}
  .calc-grid button.clear{background:#c0455b;}
  .calc-grid button.zero{grid-column:span 2;}

  /* ---------- Game menu ---------- */
  #gameMenuModal .modal{width:320px;}
  .game-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .game-list button{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    background:var(--panel-light);
    border:1px solid rgba(94,200,255,0.2);
    border-radius:12px;
    color:var(--text);
    font-size:1.05rem;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    text-align:left;
  }
  .game-list button:hover{background:#1c4f9c;transform:translateX(4px);}
  .game-list button .g-icon{font-size:1.5rem;}

  /* ---------- Game play modal ---------- */
  #playModal .modal{
    width:min(94vw,520px);
  }
  .game-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .game-header h2{margin:0;}
  .back-btn{
    background:var(--panel-light);
    border:none;
    color:var(--text);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
  }
  .back-btn:hover{background:#1c4f9c;}
  #gameArea{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  canvas{
    background:#081733;
    border-radius:12px;
    touch-action:none;
    max-width:100%;
  }
  .score{
    color:var(--accent2);
    font-weight:600;
  }
  .hint{
    color:var(--text-dim);
    font-size:0.85rem;
    text-align:center;
  }
  .fight-bars{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:6px;
  }
  .bar-row{display:flex;align-items:center;gap:8px;font-size:0.85rem;}
  .bar-outer{
    flex:1;
    height:14px;
    background:#081733;
    border-radius:7px;
    overflow:hidden;
  }
  .bar-inner{height:100%;transition:width .15s ease;}
  .bar-inner.you{background:var(--accent);}
  .bar-inner.foe{background:#e05d6f;}
  .fight-btn{
    padding:14px 28px;
    font-size:1.1rem;
    border:none;
    border-radius:12px;
    background:var(--accent2);
    color:#20260a;
    font-weight:700;
    cursor:pointer;
  }
  .fight-btn:active{transform:scale(.95);}
  #mergeGrid, #blastGrid{
    display:grid;
    gap:4px;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
  }
  footer{
    text-align:center;
    color:var(--text-dim);
    padding:30px 10px 40px;
    font-size:0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Recharger</h1>
  <p>Rechnen. Spielen. Aufladen.</p>
</header>

<div class="dock">
  <div class="dock-btn" id="calcOpenBtn">
    <div class="icon">🧮</div>
    <span class="label">Taschenrechner</span>
  </div>
  <div class="dock-btn" id="gameOpenBtn">
    <div class="icon">🎮</div>
    <span class="label">Spiele</span>
  </div>
</div>

<footer>Recharger — deine kleine Ecke zum Rechnen und Zocken.</footer>

<!-- Calculator Modal -->
<div class="overlay" id="calcModal">
  <div class="modal">
    <button class="close-btn" data-close="calcModal">✕</button>
    <h2>Taschenrechner</h2>
    <div id="calcDisplay">0</div>
    <div class="calc-grid">
      <button class="clear" data-key="C">C</button>
      <button data-key="(">(</button>
      <button data-key=")">)</button>
      <button class="op" data-key="/">÷</button>

      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="op" data-key="*">×</button>

      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button class="op" data-key="-">−</button>

      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="op" data-key="+">+</button>

      <button class="zero" data-key="0">0</button>
      <button data-key=".">.</button>
      <button class="eq" data-key="=">=</button>
    </div>
  </div>
</div>

<!-- Game Menu Modal -->
<div class="overlay" id="gameMenuModal">
  <div class="modal">
    <button class="close-btn" data-close="gameMenuModal">✕</button>
    <h2>Spiele</h2>
    <div class="game-list">
      <button data-game="snake"><span class="g-icon">🐍</span> Snake</button>
      <button data-game="fight"><span class="g-icon">🥋</span> Stickman Fight</button>
      <button data-game="blast"><span class="g-icon">🧱</span> Block Blast</button>
      <button data-game="merge"><span class="g-icon">🍉</span> Fruit Merge</button>
    </div>
  </div>
</div>

<!-- Play Modal (Spielbereich) -->
<div class="overlay" id="playModal">
  <div class="modal">
    <div class="game-header">
      <h2 id="playTitle">Spiel</h2>
      <button class="back-btn" id="backToMenuBtn">⟵ Menü</button>
    </div>
    <div id="gameArea"></div>
  </div>
</div>

<script>
/* ---------------- Modal Helpers ---------------- */
function openModal(id){document.getElementById(id).classList.add('active');}
function closeModal(id){document.getElementById(id).classList.remove('active');}

document.getElementById('calcOpenBtn').onclick = ()=>openModal('calcModal');
document.getElementById('gameOpenBtn').onclick = ()=>openModal('gameMenuModal');

document.querySelectorAll('[data-close]').forEach(btn=>{
  btn.onclick = ()=>closeModal(btn.dataset.close);
});

// Klick auf Overlay-Hintergrund schließt das Modal
document.querySelectorAll('.overlay').forEach(ov=>{
  ov.addEventListener('click', e=>{
    if(e.target === ov){ov.classList.remove('active'); stopCurrentGame();}
  });
});

/* ---------------- Taschenrechner ---------------- */
const display = document.getElementById('calcDisplay');
let expr = '';
document.querySelectorAll('.calc-grid button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const key = btn.dataset.key;
    if(key === 'C'){
      expr = '';
      display.textContent = '0';
      return;
    }
    if(key === '='){
      try{
        // Nur erlaubte Zeichen zulassen
        if(/^[0-9+\-*/.() ]+$/.test(expr)){
          const result = Function('"use strict";return (' + expr + ')')();
          expr = String(result);
          display.textContent = expr;
        }else{
          display.textContent = 'Fehler';
          expr = '';
        }
      }catch(e){
        display.textContent = 'Fehler';
        expr = '';
      }
      return;
    }
    expr += key;
    display.textContent = expr;
  });
});

/* ---------------- Game Menu -> Play routing ---------------- */
document.querySelectorAll('[data-game]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    closeModal('gameMenuModal');
    openGame(btn.dataset.game);
  });
});
document.getElementById('backToMenuBtn').onclick = ()=>{
  stopCurrentGame();
  closeModal('playModal');
  openModal('gameMenuModal');
};

let currentStop = null;
function stopCurrentGame(){
  if(currentStop){ currentStop(); currentStop = null; }
}

const titles = {
  snake:'Snake',
  fight:'Stickman Fight',
  blast:'Block Blast',
  merge:'Fruit Merge'
};

function openGame(key){
  document.getElementById('playTitle').textContent = titles[key];
  const area = document.getElementById('gameArea');
  area.innerHTML = '';
  openModal('playModal');
  if(key==='snake') currentStop = initSnake(area);
  if(key==='fight') currentStop = initFight(area);
  if(key==='blast') currentStop = initBlast(area);
  if(key==='merge') currentStop = initMerge(area);
}

/* =================================================================
   SNAKE
================================================================= */
function initSnake(area){
  area.innerHTML = `
    <div class="score">Punkte: <span id="snakeScore">0</span></div>
    <canvas id="snakeCanvas" width="320" height="320"></canvas>
    <div class="hint">Pfeiltasten oder Wischen zum Steuern — Wände sind tödlich!</div>
  `;
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const grid = 16;
  const cells = canvas.width/grid;
  let snake, dir, nextDir, food, score, alive, loopId;

  function reset(){
    snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    alive = true;
    placeFood();
    document.getElementById('snakeScore').textContent = score;
  }
  function placeFood(){
    food = {x:Math.floor(Math.random()*cells), y:Math.floor(Math.random()*cells)};
  }
  function draw(){
    ctx.fillStyle = '#081733';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle = '#e05d6f';
    ctx.lineWidth = 4;
    ctx.strokeRect(2,2,canvas.width-4,canvas.height-4);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(food.x*grid, food.y*grid, grid-2, grid-2);
    ctx.fillStyle = '#5ec8ff';
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? '#eaf4ff' : '#5ec8ff';
      ctx.fillRect(s.x*grid, s.y*grid, grid-2, grid-2);
    });
    if(!alive){
      ctx.fillStyle = 'rgba(5,12,30,0.7)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '20px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('Game Over — Klick zum Neustart', canvas.width/2, canvas.height/2);
    }
  }
  function step(){
    if(!alive) return;
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=cells||head.y>=cells||snake.some(s=>s.x===head.x&&s.y===head.y)){
      alive = false;
      draw();
      return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){
      score++;
      document.getElementById('snakeScore').textContent = score;
      placeFood();
    }else{
      snake.pop();
    }
    draw();
  }
  function keyHandler(e){
    const map = {ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
    const nd = map[e.key];
    if(nd && !(nd.x===-nextDir.x && nd.y===-nextDir.y)){ nextDir = nd; e.preventDefault(); }
  }
  let touchStart = null;
  function touchStartH(e){ touchStart = e.touches[0]; }
  function touchEndH(e){
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.clientX;
    const dy = t.clientY - touchStart.clientY;
    let nd;
    if(Math.abs(dx) > Math.abs(dy)) nd = dx>0 ? {x:1,y:0} : {x:-1,y:0};
    else nd = dy>0 ? {x:0,y:1} : {x:0,y:-1};
    if(!(nd.x===-dir.x && nd.y===-dir.y)) nextDir = nd;
  }
  function clickHandler(){ if(!alive) reset(); }

  document.addEventListener('keydown', keyHandler);
  canvas.addEventListener('touchstart', touchStartH);
  canvas.addEventListener('touchend', touchEndH);
  canvas.addEventListener('click', clickHandler);

  reset();
  draw();
  loopId = setInterval(step, 120);

  return function stop(){
    clearInterval(loopId);
    document.removeEventListener('keydown', keyHandler);
    canvas.removeEventListener('touchstart', touchStartH);
    canvas.removeEventListener('touchend', touchEndH);
    canvas.removeEventListener('click', clickHandler);
  };
}

/* =================================================================
   STICKMAN FIGHT (Laufen, Springen, Schlagen)
================================================================= */
function initFight(area){
  area.innerHTML = `
    <div class="fight-bars">
      <div class="bar-row">Du
        <div class="bar-outer"><div class="bar-inner you" id="youBar" style="width:100%"></div></div>
      </div>
      <div class="bar-row">Gegner
        <div class="bar-outer"><div class="bar-inner foe" id="foeBar" style="width:100%"></div></div>
      </div>
    </div>
    <canvas id="fightCanvas" width="360" height="200"></canvas>
    <div class="hint" id="fightMsg">← → Laufen · ↑ / Leertaste Springen · X Schlagen</div>
  `;
  const canvas = document.getElementById('fightCanvas');
  const ctx = canvas.getContext('2d');
  const groundY = 160;
  const W = canvas.width;
  let over = false, rafId;
  const msg = document.getElementById('fightMsg');

  const you = { x:60, y:groundY, vy:0, onGround:true, facing:1, hp:100, punchTimer:0, hitCooldown:0 };
  const foe = { x:280, y:groundY, vy:0, onGround:true, facing:-1, hp:100, punchTimer:0, hitCooldown:0, aiTimer:0 };

  const keysDown = {};
  function keyDown(e){
    if(['ArrowLeft','ArrowRight','ArrowUp',' ','x','X'].includes(e.key)) e.preventDefault();
    keysDown[e.key] = true;
    if((e.key==='x'||e.key==='X') && !over) punch(you, foe);
  }
  function keyUp(e){ keysDown[e.key] = false; }
  document.addEventListener('keydown', keyDown);
  document.addEventListener('keyup', keyUp);

  function punch(attacker, defender){
    if(attacker.punchTimer>0) return;
    attacker.punchTimer = 18;
    const dist = Math.abs(attacker.x - defender.x);
    const facingRight = attacker.facing===1 ? defender.x > attacker.x : defender.x < attacker.x;
    if(dist < 55 && facingRight){
      const dmg = 6 + Math.random()*6;
      defender.hp = Math.max(0, defender.hp - dmg);
      defender.hitCooldown = 8;
      updateBars();
    }
  }

  function updateBars(){
    document.getElementById('youBar').style.width = you.hp+'%';
    document.getElementById('foeBar').style.width = foe.hp+'%';
    if(you.hp<=0 || foe.hp<=0) endFight();
  }
  function endFight(){
    over = true;
    msg.textContent = you.hp<=0 ? 'Du hast verloren! Klick "Menü", um es erneut zu versuchen.' : 'Du hast gewonnen! 🎉';
  }

  function drawStick(p, color){
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    const headY = p.y - 78;
    ctx.beginPath();
    ctx.arc(p.x, headY, 13, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x, headY+13); ctx.lineTo(p.x, p.y-30);
    ctx.moveTo(p.x, p.y-30); ctx.lineTo(p.x-13, p.y);
    ctx.moveTo(p.x, p.y-30); ctx.lineTo(p.x+13, p.y);
    const armLen = p.punchTimer>0 ? 30 : 14;
    ctx.moveTo(p.x, headY+26); ctx.lineTo(p.x + p.facing*armLen, headY+40);
    ctx.moveTo(p.x, headY+26); ctx.lineTo(p.x - p.facing*8, headY+40);
    ctx.stroke();
    if(p.hitCooldown>0){
      ctx.strokeStyle = '#ffd166';
      ctx.beginPath();
      ctx.arc(p.x, headY, 20, 0, Math.PI*2);
      ctx.stroke();
    }
  }

  function draw(){
    ctx.fillStyle = '#081733';
    ctx.fillRect(0,0,W,canvas.height);
    ctx.strokeStyle = 'rgba(94,200,255,0.3)';
    ctx.beginPath(); ctx.moveTo(0,groundY); ctx.lineTo(W,groundY); ctx.stroke();
    drawStick(you, '#5ec8ff');
    drawStick(foe, '#e05d6f');
    if(over){
      ctx.fillStyle = 'rgba(5,12,30,0.6)';
      ctx.fillRect(0,0,W,canvas.height);
    }
  }

  function physics(p){
    p.y += p.vy;
    if(p.y < groundY){ p.vy += 0.9; }
    else { p.y = groundY; p.vy = 0; p.onGround = true; }
    if(p.punchTimer>0) p.punchTimer--;
    if(p.hitCooldown>0) p.hitCooldown--;
  }

  function update(){
    // Spielersteuerung
    if(keysDown['ArrowLeft']){ you.x -= 3.2; you.facing = -1; }
    if(keysDown['ArrowRight']){ you.x += 3.2; you.facing = 1; }
    if((keysDown['ArrowUp'] || keysDown[' ']) && you.onGround){ you.vy = -13; you.onGround = false; }
    you.x = Math.max(20, Math.min(W-20, you.x));
    physics(you);

    // simple KI-Gegner: annähern, gelegentlich springen und schlagen
    foe.aiTimer--;
    const dist = you.x - foe.x;
    if(Math.abs(dist) > 60){
      foe.x += Math.sign(dist) * 2;
      foe.facing = Math.sign(dist) || foe.facing;
    } else if(foe.aiTimer<=0){
      punch(foe, you);
      foe.aiTimer = 45 + Math.random()*40;
    }
    if(foe.onGround && Math.random()<0.006){ foe.vy = -12; foe.onGround = false; }
    foe.x = Math.max(20, Math.min(W-20, foe.x));
    physics(foe);

    draw();
    if(!over) rafId = requestAnimationFrame(update);
    else { draw(); }
  }

  function clickRestart(e){
    if(over){
      you.hp = 100; foe.hp = 100; you.x = 60; foe.x = 280; over = false;
      updateBars();
      msg.textContent = '← → Laufen · ↑ / Leertaste Springen · X Schlagen';
      rafId = requestAnimationFrame(update);
    }
  }
  canvas.addEventListener('click', clickRestart);

  draw();
  rafId = requestAnimationFrame(update);

  return function stop(){
    cancelAnimationFrame(rafId);
    document.removeEventListener('keydown', keyDown);
    document.removeEventListener('keyup', keyUp);
    canvas.removeEventListener('click', clickRestart);
  };
}

/* =================================================================
   BLOCK BLAST (Tetris)
================================================================= */
function initBlast(area){
  area.innerHTML = `
    <div class="score">Punkte: <span id="blastScore">0</span> &nbsp;|&nbsp; Level: <span id="blastLevel">1</span></div>
    <canvas id="blastCanvas" width="240" height="440"></canvas>
    <div class="hint">← → bewegen · ↑ drehen · ↓ schneller fallen · Leertaste: Hard-Drop</div>
  `;
  const cols = 8, rows = 16, cell = 30;
  const canvas = document.getElementById('blastCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = cols*cell;
  canvas.height = rows*cell;

  const shapes = {
    I: [[1,1,1,1]],
    O: [[1,1],[1,1]],
    T: [[0,1,0],[1,1,1]],
    S: [[0,1,1],[1,1,0]],
    Z: [[1,1,0],[0,1,1]],
    J: [[1,0,0],[1,1,1]],
    L: [[0,0,1],[1,1,1]]
  };
  const colors = {I:'#5ec8ff',O:'#ffd166',T:'#c084fc',S:'#7ee08c',Z:'#e05d6f',J:'#4d7fe0',L:'#ff9d5c'};
  const keys = Object.keys(shapes);

  let board, cur, score, level, dropInterval, dropTimer, over, rafId, lastTime;

  function newPiece(){
    const k = keys[Math.floor(Math.random()*keys.length)];
    const shape = shapes[k].map(r=>r.slice());
    return { shape, key:k, x: Math.floor(cols/2) - Math.ceil(shape[0].length/2), y: 0 };
  }
  function reset(){
    board = Array.from({length:rows},()=>Array(cols).fill(null));
    score = 0; level = 1; dropInterval = 800; over = false;
    cur = newPiece();
    document.getElementById('blastScore').textContent = score;
    document.getElementById('blastLevel').textContent = level;
  }
  function collides(shape, x, y){
    for(let r=0;r<shape.length;r++){
      for(let c=0;c<shape[r].length;c++){
        if(!shape[r][c]) continue;
        const nx = x+c, ny = y+r;
        if(nx<0||nx>=cols||ny>=rows) return true;
        if(ny>=0 && board[ny][nx]) return true;
      }
    }
    return false;
  }
  function merge(){
    cur.shape.forEach((row,r)=>row.forEach((v,c)=>{
      if(v){ const ny=cur.y+r, nx=cur.x+c; if(ny>=0) board[ny][nx]=cur.key; }
    }));
  }
  function clearLines(){
    let cleared = 0;
    for(let r=rows-1;r>=0;r--){
      if(board[r].every(v=>v)){
        board.splice(r,1);
        board.unshift(Array(cols).fill(null));
        cleared++; r++;
      }
    }
    if(cleared){
      score += [0,100,300,500,800][cleared] * level;
      level = 1 + Math.floor(score/500);
      dropInterval = Math.max(140, 800 - (level-1)*70);
      document.getElementById('blastScore').textContent = score;
      document.getElementById('blastLevel').textContent = level;
    }
  }
  function lockPiece(){
    merge();
    clearLines();
    cur = newPiece();
    if(collides(cur.shape, cur.x, cur.y)){ over = true; }
  }
  function rotate(){
    const s = cur.shape;
    const rotated = s[0].map((_,i)=>s.map(row=>row[i]).reverse());
    if(!collides(rotated, cur.x, cur.y)) cur.shape = rotated;
    else if(!collides(rotated, cur.x-1, cur.y)){ cur.x--; cur.shape = rotated; }
    else if(!collides(rotated, cur.x+1, cur.y)){ cur.x++; cur.shape = rotated; }
  }
  function move(dx){ if(!collides(cur.shape, cur.x+dx, cur.y)) cur.x += dx; }
  function softDrop(){
    if(!collides(cur.shape, cur.x, cur.y+1)) cur.y++;
    else lockPiece();
  }
  function hardDrop(){
    while(!collides(cur.shape, cur.x, cur.y+1)) cur.y++;
    lockPiece();
  }
  function drawCell(x,y,color){
    ctx.fillStyle = color;
    ctx.fillRect(x*cell+1, y*cell+1, cell-2, cell-2);
  }
  function draw(){
    ctx.fillStyle = '#081733';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) if(board[r][c]) drawCell(c,r,colors[board[r][c]]);
    cur.shape.forEach((row,r)=>row.forEach((v,c)=>{ if(v) drawCell(cur.x+c, cur.y+r, colors[cur.key]); }));
    if(over){
      ctx.fillStyle = 'rgba(5,12,30,0.75)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 10);
      ctx.font = '14px sans-serif';
      ctx.fillText('Klick zum Neustart', canvas.width/2, canvas.height/2 + 14);
    }
  }
  function loop(time){
    if(!lastTime) lastTime = time;
    const delta = time - lastTime;
    if(!over && delta > dropInterval){
      softDrop();
      lastTime = time;
    } else if(over){
      lastTime = time;
    }
    draw();
    rafId = requestAnimationFrame(loop);
  }
  function keyHandler(e){
    if(over) return;
    if(e.key==='ArrowLeft'){ move(-1); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ move(1); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ rotate(); e.preventDefault(); }
    else if(e.key==='ArrowDown'){ softDrop(); e.preventDefault(); }
    else if(e.key===' '){ hardDrop(); e.preventDefault(); }
  }
  function clickHandler(){ if(over) reset(); }

  document.addEventListener('keydown', keyHandler);
  canvas.addEventListener('click', clickHandler);

  reset();
  rafId = requestAnimationFrame(loop);

  return function stop(){
    cancelAnimationFrame(rafId);
    document.removeEventListener('keydown', keyHandler);
    canvas.removeEventListener('click', clickHandler);
  };
}

/* =================================================================
   FRUIT MERGE (2048-artig)
================================================================= */
function initMerge(area){
  area.innerHTML = `
    <div class="score">Punkte: <span id="mergeScore">0</span></div>
    <div id="mergeGrid"></div>
    <div class="hint">Pfeiltasten (oder Wischen): gleiche Früchte verschmelzen zur nächsten!</div>
  `;
  const size = 4;
  const gridEl = document.getElementById('mergeGrid');
  gridEl.style.gridTemplateColumns = `repeat(${size}, 64px)`;
  const fruits = ['🍒','🍓','🍊','🍎','🍍','🍉','🍈','🥥'];
  let board, score;

  function reset(){
    board = Array.from({length:size},()=>Array(size).fill(0));
    score = 0;
    addRandom(); addRandom();
    render();
  }
  function addRandom(){
    const empty = [];
    for(let r=0;r<size;r++)for(let c=0;c<size;c++) if(!board[r][c]) empty.push([r,c]);
    if(!empty.length) return;
    const [r,c] = empty[Math.floor(Math.random()*empty.length)];
    board[r][c] = 1;
  }
  function render(){
    gridEl.innerHTML = '';
    for(let r=0;r<size;r++){
      for(let c=0;c<size;c++){
        const cell = document.createElement('div');
        cell.className='cell';
        cell.style.width='64px';
        cell.style.height='64px';
        cell.style.fontSize='2rem';
        cell.style.background = '#0f2a5c';
        if(board[r][c]) cell.textContent = fruits[Math.min(board[r][c]-1, fruits.length-1)];
        gridEl.appendChild(cell);
      }
    }
    document.getElementById('mergeScore').textContent = score;
  }
  function slide(row){
    const arr = row.filter(v=>v);
    for(let i=0;i<arr.length-1;i++){
      if(arr[i]===arr[i+1]){ arr[i]++; score += arr[i]*5; arr[i+1]=0; }
    }
    const merged = arr.filter(v=>v);
    while(merged.length<size) merged.push(0);
    return merged;
  }
  function move(dir){
    let moved = false;
    const before = JSON.stringify(board);
    if(dir==='left'){
      for(let r=0;r<size;r++) board[r] = slide(board[r]);
    }else if(dir==='right'){
      for(let r=0;r<size;r++) board[r] = slide(board[r].slice().reverse()).reverse();
    }else if(dir==='up'){
      for(let c=0;c<size;c++){
        let col = board.map(row=>row[c]);
        col = slide(col);
        for(let r=0;r<size;r++) board[r][c] = col[r];
      }
    }else if(dir==='down'){
      for(let c=0;c<size;c++){
        let col = board.map(row=>row[c]).reverse();
        col = slide(col).reverse();
        for(let r=0;r<size;r++) board[r][c] = col[r];
      }
    }
    moved = JSON.stringify(board) !== before;
    if(moved){ addRandom(); render(); }
  }
  function keyHandler(e){
    const map = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    if(map[e.key]){ move(map[e.key]); e.preventDefault(); }
  }
  let touchStart=null;
  function touchStartH(e){ touchStart = e.touches[0]; }
  function touchEndH(e){
    if(!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.clientX;
    const dy = t.clientY - touchStart.clientY;
    if(Math.abs(dx) > Math.abs(dy)) move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  }
  document.addEventListener('keydown', keyHandler);
  gridEl.addEventListener('touchstart', touchStartH);
  gridEl.addEventListener('touchend', touchEndH);

  reset();

  return function stop(){
    document.removeEventListener('keydown', keyHandler);
    gridEl.removeEventListener('touchstart', touchStartH);
    gridEl.removeEventListener('touchend', touchEndH);
  };
}
</script>
